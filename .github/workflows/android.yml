name: Android CI

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release to Google Play & GitHub Releases'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission to scripts
        run: chmod +x gradlew .github/decrypt_secrets.sh

      - name: Decrypt GPG secrets
        if: ${{ env.SECRETS_GPG_PASS != '' }}
        run: .github/decrypt_secrets.sh
        env:
          SECRETS_GPG_PASS: ${{ secrets.SECRETS_GPG_PASS }}

      - name: Run code checks and unit tests
        run: ./gradlew check --no-daemon

      - name: Publish with Gradle
        if: ${{ inputs.publish_release && env.KEYSTORE_STORE_PASS != '' }}
        run: ./gradlew assembleRelease publishApps --no-daemon
        env:
          KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_ALIAS: gianlu
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}

      - name: Create GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: app/src/main/play/release-notes/en-GB/production.txt
          draft: true
          prerelease: false
          files: app/build/outputs/apk/foss/release/app-foss-release.apk
